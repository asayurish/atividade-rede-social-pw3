
{% extends 'base.html' %}

{% block title %}Criar conta | Pinguino Chat{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Vamos começar!</h1>
            <p>Crie sua conta no Pinguino Chat.</p>
        </div>

        <form action="{{ url_for('cadastro') }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Nickname</label>
                <input type="text"
                       name="nome"
                       class="form-control"
                       placeholder="Como quer ser chamado?"
                       maxlength="100"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Seu e-mail"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password"
                       name="senha"
                       class="form-control"
                       placeholder="Crie uma senha"
                       required>
            </div>

            <button type="submit" class="btn-primary-custom">
                CRIAR MINHA CONTA
            </button>

        </form>

        <p class="auth-footer">
            Já possui uma conta?
            <a href="{{ url_for('login') }}">Entrar</a>
        </p>

    </div>

</div>

{% endblock %}
